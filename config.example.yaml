drafts_path: ~/Library/Containers/pro.writer.mac/Data/Documents/
site_path: ~/Documents/from the abysmal (site)/

# Folders under drafts_path that this pipeline must never scan.
# Other sites share the iA Writer container; without this, their drafts get
# ranked and published to the wrong blog. Matched per path component,
# case-insensitively, at any depth.
exclude_dirs:
  - "Fairy Food"

sftp:
  host: your-sftp-host.example.com
  port: 22
  username: your-username
  password: your-password
  remote_root: /

email:
  pipeline_address: your-pipeline-email@gmail.com
  pipeline_password: your-app-password
  notify_esther: your-personal-email@example.com
  notify_kiryll: thehereticalinvestigator@gmail.com
  smtp_host: smtp.gmail.com
  smtp_port: 587
  imap_host: imap.gmail.com
  imap_port: 993

schedule:
  weekday_hour: 8
  veto_window_hours: 4
  weekend_hour: 10

editorial:
  min_words: 500
  min_chars: 500
  max_veto_before_warning: 5

# Long-lived Claude CLI token from `claude setup-token`.
# setup-token only PRINTS the token - it does not install it. Paste it here
# or the CLI keeps using its expired keychain login and every run dies at 401.
claude_oauth_token: ""
